<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SETLIST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="logo">SETLIST</div>
  <div class="sub">Loading…</div>
</div>

<!-- Sign-in -->
<div id="signin">
  <div class="logo">SETLIST</div>
  <div class="tagline">Your personal concert tracker.</div>
  <button class="btn-google" id="btn-signin">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
      <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
      <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
      <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
      <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
    </svg>
    Sign in with Google
  </button>
</div>

<!-- App -->
<div id="app">
  <header class="hdr">
    <div class="hdr-logo">SETLIST</div>
    <div class="hdr-right" id="hdr-right">
      <div class="saving-dot" id="saving-dot"></div>
      <span class="hdr-count" id="hdr-count"></span>
      <button class="btn-out" id="btn-signout">sign out</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab on" data-tab="upcoming">Upcoming</div>
    <div class="tab"    data-tab="attended">Attended</div>
    <div class="tab"    data-tab="all">All</div>
  </div>

  <div class="type-pills" id="type-pills">
    <button class="type-pill on" data-type="all">All</button>
    <button class="type-pill"    data-type="show">Shows</button>
    <button class="type-pill"    data-type="festival">Festivals</button>
  </div>

  <div class="search-wrap">
    <input id="search" class="search-input" type="search"
           placeholder="search artists, venues…" autocomplete="off" autocorrect="off">
  </div>

  <div class="list" id="list"></div>

  <footer class="stats">
    <div class="stat"><div class="stat-n" id="s-interested">0</div><div class="stat-l">Interested</div></div>
    <div class="stat"><div class="stat-n" id="s-planned">0</div><div class="stat-l">Planned</div></div>
    <div class="stat"><div class="stat-n" id="s-bought">0</div><div class="stat-l">Ticket</div></div>
    <div class="stat"><div class="stat-n" id="s-attended">0</div><div class="stat-l">Attended</div></div>
  </footer>

  <button class="fab" id="fab" aria-label="Add show">+</button>
</div>

<!-- Modal backdrop -->
<div class="backdrop" id="backdrop"></div>

<!-- Modal -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Add entry">
  <div class="modal-handle"></div>

  <div class="type-toggle">
    <button class="type-btn on" data-type="show">Show</button>
    <button class="type-btn"   data-type="festival">Festival</button>
  </div>

  <!-- Show-only fields -->
  <div id="show-fields">
    <div class="fg" id="artist-fg">
      <label class="fl" for="artist-in">Artist</label>
      <input class="fi" id="artist-in" placeholder="Search artist…" autocomplete="off">
      <div class="ac-list" id="artist-ac"></div>
    </div>
    <div class="fg">
      <label class="fl" for="tour-in">Tour / Event <span>(optional)</span></label>
      <input class="fi" id="tour-in" placeholder="e.g. The Black Parade Tour">
    </div>
  </div>

  <!-- Festival-only fields -->
  <div id="fest-fields" style="display:none">
    <div class="fg">
      <label class="fl" for="fest-in">Festival name</label>
      <input class="fi" id="fest-in" placeholder="e.g. Glastonbury 2025" autocomplete="off">
      <div class="ac-list" id="fest-ac"></div>
    </div>
  </div>

  <!-- Shared: Venue + City -->
  <div class="fg" id="venue-fg">
    <label class="fl" for="venue-in">Venue</label>
    <input class="fi" id="venue-in" placeholder="Search venue…" autocomplete="off">
    <div class="ac-list" id="venue-ac"></div>
  </div>
  <div class="fg" id="city-fg">
    <label class="fl" for="city-in">City <span>(auto-filled)</span></label>
    <input class="fi" id="city-in" placeholder="e.g. San Francisco, CA">
  </div>

  <!-- Date: show (multi-date) -->
  <div id="date-show-fg">
    <label class="fl">Date</label>
    <div class="multi-date-list" id="multi-date-list">
      <div class="multi-date-row">
        <input class="fi multi-date-in" type="date">
        <button class="btn-date-remove" style="display:none" aria-label="Remove date">×</button>
      </div>
    </div>
    <button class="btn-date-add" id="btn-date-add">+ Add another date</button>
  </div>

  <!-- Date: festival -->
  <div id="date-fest-fg" style="display:none">
    <div class="date-row">
      <div class="fg">
        <label class="fl" for="date-from-in">From</label>
        <input class="fi" id="date-from-in" type="date">
      </div>
      <div class="fg">
        <label class="fl" for="date-to-in">To <span>(optional)</span></label>
        <input class="fi" id="date-to-in" type="date">
        <span id="date-to-err" class="field-err"></span>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div class="fg">
    <label class="fl">Status</label>
    <div class="status-btns">
      <button class="s-btn on-interested" data-status="interested">Interested</button>
      <button class="s-btn"              data-status="planned">Planned</button>
      <button class="s-btn"              data-status="bought">Ticket ✓</button>
      <button class="s-btn"              data-status="attended">Attended</button>
    </div>
  </div>

  <!-- Notes -->
  <div class="fg">
    <label class="fl" for="notes-in">Notes <span>(optional)</span></label>
    <textarea class="fi" id="notes-in" rows="2" placeholder="on sale dates, going with…" style="resize:none"></textarea>
  </div>

  <button class="btn-add" id="btn-add">Add</button>
</div>

<!-- Import modal -->
<div class="backdrop" id="import-backdrop"></div>
<div class="modal" id="import-modal" role="dialog" aria-modal="true" aria-label="Import data">
  <div class="modal-handle"></div>
  <div style="margin-bottom:16px">
    <div style="font-family:'Bebas Neue';font-size:24px;letter-spacing:.06em;margin-bottom:6px">Import your data</div>
    <div style="font-size:12px;color:var(--dim);line-height:1.6">Paste the contents of your <code style="color:var(--text)">setlist-data.json</code> file below, then tap Import.</div>
  </div>
  <div class="fg">
    <textarea class="fi" id="import-text" rows="8"
      placeholder='[{"id":"...","type":"show",...}]'
      style="resize:vertical;font-size:12px;line-height:1.5"></textarea>
  </div>
  <button class="btn-add" id="btn-import">Import</button>
  <button id="btn-import-skip" style="width:100%;background:none;border:none;color:var(--dim);font-family:'DM Mono';font-size:12px;padding:12px;cursor:pointer;margin-top:4px">Skip — start fresh</button>
</div>

<!-- Edit modal -->
<div class="backdrop" id="edit-backdrop"></div>
<div class="modal" id="edit-modal" role="dialog" aria-modal="true" aria-label="Edit entry">
  <div class="modal-handle"></div>

  <div class="edit-hdr">
    <button class="btn-edit-del" id="btn-edit-del">Delete</button>
    <span class="edit-attended-label" id="edit-attended-label">attended — limited edits</span>
  </div>

  <!-- Type toggle (edit) -->
  <div class="type-toggle" id="edit-type-toggle">
    <button class="type-btn on" data-type="show" id="edit-type-btn-show">Show</button>
    <button class="type-btn"   data-type="festival" id="edit-type-btn-festival">Festival</button>
  </div>

  <!-- Show fields (edit) -->
  <div id="edit-show-fields">
    <div class="fg">
      <label class="fl" for="edit-artist-in">Artist</label>
      <input class="fi" id="edit-artist-in" autocomplete="off" placeholder="Artist name">
      <div class="ac-list" id="edit-artist-ac"></div>
    </div>
    <div class="fg">
      <label class="fl" for="edit-tour-in">Tour / Event <span>(optional)</span></label>
      <input class="fi" id="edit-tour-in">
    </div>
  </div>

  <!-- Festival fields (edit) -->
  <div id="edit-fest-fields" style="display:none">
    <div class="fg">
      <label class="fl" for="edit-fest-in">Festival name</label>
      <input class="fi" id="edit-fest-in" autocomplete="off">
      <div class="ac-list" id="edit-fest-ac"></div>
    </div>
  </div>

  <!-- Shared: Venue -->
  <div class="fg">
    <label class="fl" for="edit-venue-in">Venue</label>
    <input class="fi" id="edit-venue-in" autocomplete="off" placeholder="Search venue…">
    <div class="ac-list" id="edit-venue-ac"></div>
  </div>

  <!-- City + Country -->
  <div class="date-row">
    <div class="fg">
      <label class="fl" for="edit-city-in">City</label>
      <input class="fi" id="edit-city-in">
    </div>
    <div class="fg">
      <label class="fl" for="edit-country-in">Country</label>
      <input class="fi" id="edit-country-in">
    </div>
  </div>

  <!-- Date: show -->
  <div class="fg" id="edit-date-show-fg">
    <label class="fl" for="edit-date-in">Date</label>
    <input class="fi" id="edit-date-in" type="date">
  </div>

  <!-- Date: festival -->
  <div id="edit-date-fest-fg" style="display:none">
    <div class="date-row">
      <div class="fg">
        <label class="fl" for="edit-date-from-in">From</label>
        <input class="fi" id="edit-date-from-in" type="date">
      </div>
      <div class="fg">
        <label class="fl" for="edit-date-to-in">To</label>
        <input class="fi" id="edit-date-to-in" type="date">
        <span id="edit-date-to-err" class="field-err"></span>
      </div>
    </div>
  </div>

  <!-- Status (hidden for attended entries) -->
  <div class="fg" id="edit-status-fg">
    <label class="fl">Status</label>
    <div class="status-btns" id="edit-status-btns">
      <button class="s-btn" data-status="interested">Interested</button>
      <button class="s-btn" data-status="planned">Planned</button>
      <button class="s-btn" data-status="bought">Ticket ✓</button>
      <button class="s-btn" data-status="attended">Attended</button>
    </div>
  </div>

  <!-- Lineup section (festivals only) -->
  <div id="edit-lineup-section" style="display:none">
    <div class="lineup-hdr">
      <span class="lineup-label" id="lineup-label">LINEUP · 0 ARTISTS</span>
      <button class="lineup-fetch-btn" id="btn-lineup-fetch">
        <span style="color:var(--amber)">●</span> Fetch from MusicBrainz
      </button>
    </div>
    <div class="lineup-chips" id="lineup-chips"></div>

    <!-- MusicBrainz results (shown after fetch) -->
    <div id="lineup-mb-section" style="display:none">
      <div class="lineup-mb-event" id="lineup-mb-event"></div>
      <input class="fi" id="lineup-mb-filter" placeholder="Filter artists…"
             style="display:none; margin-bottom:8px">
      <div class="lineup-mb-chips" id="lineup-mb-chips"></div>
      <div class="lineup-mb-actions" id="lineup-mb-actions"></div>
    </div>

    <!-- Manual add -->
    <div class="lineup-add-row">
      <div class="fg" style="flex:1;margin-bottom:0">
        <input class="fi" id="lineup-add-in" placeholder="Add artist manually…" autocomplete="off">
        <div class="ac-list" id="lineup-add-ac"></div>
      </div>
      <button class="lineup-add-btn" id="btn-lineup-add">+</button>
    </div>

    <!-- Paste multiple artists -->
    <div class="lineup-paste-row">
      <label class="fl">Paste list <span>(comma or line separated)</span></label>
      <textarea class="fi" id="lineup-paste-in" rows="2"
        placeholder="arctic monkeys, the strokes, pj harvey…"
        style="resize:none;margin-bottom:6px"></textarea>
      <button class="lineup-paste-btn" id="btn-lineup-paste">+ Add all from list</button>
    </div>
  </div>

  <!-- Notes -->
  <div class="fg">
    <label class="fl" for="edit-notes-in">Notes <span>(optional)</span></label>
    <textarea class="fi" id="edit-notes-in" rows="2" placeholder="on sale dates, going with…" style="resize:none"></textarea>
  </div>

  <button class="btn-add" id="btn-edit-save">Save changes</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
